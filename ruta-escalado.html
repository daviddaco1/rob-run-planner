<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rob Run · Ruta de escalado</title>
<!-- Herramienta 100% externa y manual: no lee ni toca el juego. Datos solo en este equipo (localStorage) + exportar/importar JSON.
     Lógica y reglas en core.js, datos del juego en catalogo.js, iconos en iconos.js; este archivo solo pinta la interfaz. -->
<style>
/* ===== Sistema de diseño: tokens ===== */
:root{
  --bg:#0e0f12;--bg2:#14151a;--card:#1a1b21;--card2:#212229;--line:#2b2c35;--line2:#3a3b47;
  --text:#ececf1;--muted:#a4a5b1;--faint:#767784;
  --acc:#f2b632;--acc2:#ffcf5c;--acc-ink:#1b1404;--acc-soft:#f2b6321c;
  --ok:#4cc38a;--err:#ef5a52;--warn:#f0993e;--info:#5ea8f2;
  --ok-soft:#4cc38a1c;--err-soft:#ef5a5220;--warn-soft:#f0993e1f;--info-soft:#5ea8f21c;
  --r-u:#4cc38a;--r-e:#a879ff;--r-l:#f2b632;
  --k-title:#f2b632;--k-base:#8b97ff;--k-grow:#4cc38a;--k-smug:#f0993e;--k-chem:#3fc6d8;--k-def:#ef5a52;--k-other:#9aa0ad;
  --q-g:#4cc38a;--q-p:#a879ff;--q-o:#f2b632;
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.5rem;--s6:2rem;
  --rad:12px;--rad-s:8px;--rad-xs:6px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 0 #ffffff07 inset,0 8px 24px #0005;
  --t:.16s cubic-bezier(.2,.7,.2,1);
  --nav-w:0px;--aside-w:clamp(19rem,24vw,27rem);--top-h:3.6rem;
}
/* tipografía fluida: crece con la ventana (1280 px ≈ 14 px · 4K ≈ 18 px) y respeta el escalado DPI de Windows */
html{font-size:clamp(14px,.25vw + 10.5px,18px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.45 var(--font);min-height:100vh}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.3rem;font-weight:650;white-space:nowrap}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:650}
h3{font-size:1rem;font-weight:650}
a{color:var(--info)}
p{margin:.4em 0}
small,label{color:var(--muted)}
small{font-size:.85rem}
b{font-weight:650}

/* ===== iconos ===== */
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.tile{display:inline-grid;place-items:center;width:2.1rem;height:2.1rem;flex:none;border-radius:var(--rad-s);background:color-mix(in srgb,var(--kc,var(--k-other)) 16%,transparent);color:var(--kc,var(--k-other));border:1px solid color-mix(in srgb,var(--kc,var(--k-other)) 30%,transparent);position:relative}
.tile .i{width:1.25rem;height:1.25rem}
.tile.sm{width:1.6rem;height:1.6rem;border-radius:var(--rad-xs)}.tile.sm .i{width:1rem;height:1rem}
.tile.lg{width:2.8rem;height:2.8rem;border-radius:var(--rad)}.tile.lg .i{width:1.6rem;height:1.6rem}
.tile.r-u{box-shadow:inset 0 -3px 0 var(--r-u)}.tile.r-e{box-shadow:inset 0 -3px 0 var(--r-e)}.tile.r-l{box-shadow:inset 0 -3px 0 var(--r-l)}
.tile.empty{--kc:var(--faint);border-style:dashed}
.k-title{--kc:var(--k-title)}.k-base{--kc:var(--k-base)}.k-grow,.k-plant{--kc:var(--k-grow)}.k-smug,.k-repack{--kc:var(--k-smug)}.k-chem{--kc:var(--k-chem)}.k-def{--kc:var(--k-def)}.k-other{--kc:var(--k-other)}.k-acc{--kc:var(--acc)}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--dc,var(--faint));vertical-align:.05em}
.q-g{--dc:var(--q-g)}.q-p{--dc:var(--q-p)}.q-o{--dc:var(--q-o)}

/* ===== controles ===== */
input,select,textarea,button{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:var(--rad-s);padding:.38rem .6rem;min-height:2.15rem;transition:border-color var(--t),background var(--t),box-shadow var(--t)}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
input[type=checkbox]{min-height:0;width:1.1rem;height:1.1rem;accent-color:var(--acc);padding:0;cursor:pointer;flex:none}
input[type=number]{width:7.5rem;font-variant-numeric:tabular-nums}
input.w-s{width:5rem}input.w-m{width:7.5rem}
select{cursor:pointer}
textarea{width:100%;min-height:2.3rem;resize:vertical}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:550;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--acc);background:#2a2b33}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.primary:hover:not(:disabled){background:var(--acc2);border-color:var(--acc2)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover:not(:disabled){background:var(--card2);border-color:var(--line)}
button.danger:hover:not(:disabled){border-color:var(--err);color:#ff8f88}
button.icon{padding:.38rem;min-width:2.15rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== utilidades de maquetación ===== */
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.grow{flex:1 1 10rem;min-width:0}
.col{display:flex;flex-direction:column;gap:var(--s2)}
.fld{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem;min-width:0}
.fld>input,.fld>select{width:100%;font-size:1rem}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,9.5rem),1fr));gap:var(--s3)}
.tools{margin-left:auto;display:flex;gap:.25rem;align-items:center}
.mt{margin-top:var(--s3)}
.scroll{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:var(--s5);border:1px dashed var(--line);border-radius:var(--rad);font-size:.9rem}

/* ===== tarjetas ===== */
.card,.step{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:var(--s4);box-shadow:var(--shadow)}
.card+.card,.panel>*+*{margin-top:var(--s3)}
.card-h{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.card-h>.i{color:var(--acc)}
.card-h h3{flex:1}

/* ===== insignias, chips, barras ===== */
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.78rem;padding:.08rem .5rem;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;font-weight:550}
.badge .i{width:.95em;height:.95em}
.b-done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:var(--ok-soft)}
.b-prov{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:var(--warn-soft)}
.b-progress{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,transparent);background:var(--acc-soft)}
.b-blocked{color:var(--text);background:#3a3a46;border-color:#4a4a58}
.c-confirmado,.c-jugador{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}.c-una-fuente{color:var(--info);border-color:color-mix(in srgb,var(--info) 50%,transparent)}
.c-discrepancia,.c-estimado{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}.c-pendiente{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;gap:.35rem;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:.12rem .2rem .12rem .25rem;font-size:.85rem;max-width:100%}
.chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{padding:0 .3rem;min-height:1.4rem;border:0;background:none;color:var(--muted)}
.chip button:hover{color:var(--err)}
.chip button.on{color:var(--acc)}
.chip.filter{padding:.2rem .7rem;cursor:pointer}
.chip.filter[aria-pressed=true]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.bar{flex:1;min-width:6rem;height:.5rem;background:#272830;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#6fe0a8);border-radius:inherit;transition:width .4s ease}
.bar.acc i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar.sm{height:.35rem;min-width:3rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10rem),1fr));gap:var(--s2)}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rad-s);padding:.5rem .65rem;display:flex;gap:.55rem;align-items:center;min-width:0}
.kpi>.i{color:var(--acc);width:1.3rem;height:1.3rem}
.kpi span{display:flex;flex-direction:column;min-width:0}
.kpi small{font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.ok>.i{color:var(--ok)}.kpi.warn>.i{color:var(--warn)}
.kpis.sm .kpi{padding:.35rem .5rem}.kpis.sm .kpi b{font-size:.95rem}
.ring{--p:0;width:3.4rem;height:3.4rem;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(closest-side,var(--card) 76%,transparent 78% 100%),conic-gradient(var(--ok) calc(var(--p)*1%),#2a2b33 0)}
.ring b{font-size:.85rem}

/* ===== avisos, problemas y toasts ===== */
.issue{display:flex;gap:.5rem;align-items:flex-start;flex-wrap:wrap;padding:.45rem .6rem;border-radius:var(--rad-s);margin:.35rem 0;background:var(--bg2);border:1px solid var(--line);border-left-width:3px}
.issue>.i{margin-top:.1rem}
.issue .msg{flex:1 1 12rem;color:var(--text);font-size:.92rem}
.issue button{min-height:1.8rem;padding:.15rem .55rem;font-size:.85rem}
.l-error{border-left-color:var(--err);background:var(--err-soft)}.l-error>.i{color:#ff8a84}
.l-warn{border-left-color:var(--warn)}.l-warn>.i,small.l-warn{color:var(--warn)}
.l-info{border-left-color:var(--info)}.l-info>.i{color:var(--info)}
.notice{display:flex;gap:.6rem;align-items:center;border:1px solid var(--line);border-left:4px solid var(--info);background:var(--info-soft);padding:.55rem .75rem;border-radius:var(--rad-s);margin:0 0 var(--s2);animation:fade .25s ease}
.notice>.i{color:var(--info)}
.notice.n-error{border-left-color:var(--err);background:var(--err-soft)}.notice.n-error>.i{color:var(--err)}
.notice.n-warn{border-left-color:var(--warn);background:var(--warn-soft)}.notice.n-warn>.i{color:var(--warn)}
#toasts{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;max-width:min(30rem,calc(100vw - 2rem));z-index:50}
.toast{display:flex;gap:.6rem;background:#24252d;border:1px solid var(--line2);border-left:4px solid var(--info);border-radius:var(--rad-s);padding:.7rem .8rem;box-shadow:0 10px 30px #000a;animation:tin .22s cubic-bezier(.2,.8,.2,1)}
.toast>.i{color:var(--info);margin-top:.1rem}
.toast.t-error{border-left-color:var(--err)}.toast.t-error>.i{color:var(--err)}
.toast.t-ok{border-left-color:var(--ok)}.toast.t-ok>.i{color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 35%,transparent)}}

/* ===== tablas ===== */
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:.45rem .55rem;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--card)}
tr:hover td{background:#ffffff05}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.name{min-width:12rem}
td.name .tile{vertical-align:middle;margin-right:.5rem}
.tbl-wrap td:last-child{min-width:16rem}
.mini{height:.3rem;background:#272830;border-radius:999px;margin-top:.25rem;min-width:3rem}
.mini i{display:block;height:100%;border-radius:inherit;background:var(--acc)}

/* ===== estructura: barra de navegación + contenido ===== */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh}
.nav{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s3);padding:var(--s3) var(--s2);position:sticky;top:0;height:100vh;z-index:20}
.brand{display:flex;align-items:center;gap:.6rem;padding:.2rem .35rem .6rem;border-bottom:1px solid var(--line)}
.logo{width:2.3rem;height:2.3rem;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),#e07b26);color:var(--acc-ink);flex:none;box-shadow:0 4px 14px #f2b63233}
.logo .i{width:1.35rem;height:1.35rem;stroke-width:2.2}
.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand-t b{font-size:1.05rem;letter-spacing:.02em}
.brand-t small{font-size:.75rem;color:var(--acc);text-transform:uppercase;letter-spacing:.14em}
.tabs{display:flex;flex-direction:column;gap:.2rem}
.tabs button{justify-content:flex-start;gap:.7rem;background:transparent;border-color:transparent;color:var(--muted);padding:.55rem .7rem;font-weight:550;position:relative}
.tabs button .i{width:1.25rem;height:1.25rem}
.tabs button:hover{background:var(--card);color:var(--text);border-color:transparent}
.tabs button[aria-selected=true]{background:var(--acc-soft);color:var(--acc)}
.tabs button[aria-selected=true]::before{content:"";position:absolute;left:-.5rem;top:.45rem;bottom:.45rem;width:3px;border-radius:3px;background:var(--acc)}
.tabs .cnt{margin-left:auto;background:var(--ok);color:#06210f;border-radius:999px;font-size:.72rem;padding:0 .4rem;font-weight:700}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:.4rem;padding-top:.6rem;border-top:1px solid var(--line)}
.nav-foot small{padding:0 .4rem;font-size:.72rem;color:var(--faint)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:var(--s3);min-height:var(--top-h);padding:.5rem var(--s5);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-t{display:flex;align-items:center;gap:.6rem;min-width:0}
.top-t>.i{color:var(--acc);width:1.4rem;height:1.4rem}
.top-t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-kpi{display:flex;gap:.4rem;margin-left:auto;flex-wrap:wrap}
.top-kpi .badge{font-size:.82rem;padding:.2rem .6rem;background:var(--card)}
.top-kpi button.badge{min-height:0;cursor:pointer}
.top-kpi .ready{color:var(--ok);border-color:var(--ok);animation:pulse 1.6s ease infinite}
.wrap{padding:var(--s4) var(--s5) var(--s6);width:100%;max-width:3400px;margin:0 auto}

/* contenido + panel lateral (Ruta y Granja) */
.split{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr);align-items:start}
.panel{min-width:0}
.content{min-width:0;container-type:inline-size}

/* ===== RUTA ===== */
.phase{margin-bottom:var(--s5)}
.phase-h{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3);flex-wrap:wrap}
.phase-h .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.phase-h .bar{max-width:12rem}
.phase-h button{margin-left:auto}
.steps{display:grid;gap:var(--s3);grid-template-columns:minmax(0,1fr);align-items:start}
@container (min-width:1180px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:1900px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{padding:var(--s3) var(--s4);transition:border-color var(--t),box-shadow var(--t),opacity var(--t);position:relative;min-width:0}
.step-h{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.step-h .num{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.8rem}
.step-h input.title{flex:1 1 12rem;font-weight:600;background:transparent;border-color:transparent;padding-left:.35rem}
.step-h input.title:hover{border-color:var(--line)}
.step-h input.title:focus{background:var(--card2)}
.step-b{margin-top:var(--s2);display:flex;flex-direction:column;gap:var(--s2)}
.step-b>.row{gap:var(--s2) var(--s3)}
.sel-i{display:inline-flex;align-items:center;gap:.35rem;background:var(--card2);border:1px solid var(--line);border-radius:var(--rad-s);padding-left:.5rem;color:var(--acc)}
.sel-i select{border:0;background:transparent;padding-left:.1rem;color:var(--text)}
.sel-i select:focus{box-shadow:none}
.sel-i:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.inl{display:inline-flex;align-items:center;gap:.4rem}
.deps{color:var(--muted)}
.deps>.i{color:var(--faint)}
.step .tools button{min-height:1.9rem;padding:.25rem;min-width:1.9rem;background:transparent;border-color:transparent;color:var(--muted)}
.step .tools button:hover{color:var(--text);border-color:var(--line2);background:var(--card2)}
.step .tools button[data-act=del]:hover,.step .tools button[data-tact=del]:hover{color:#ff8f88;border-color:var(--err)}
.step.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 8px 28px #f2b63214}
.step.next::after{content:"Siguiente";position:absolute;top:-.6rem;right:.9rem;background:var(--acc);color:var(--acc-ink);font-size:.7rem;font-weight:700;padding:.05rem .5rem;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.step.st-done{opacity:.72;background:var(--bg2)}
.step.st-done input.title{text-decoration:line-through;text-decoration-color:var(--faint)}
.step.st-done:not(.open) .step-b{display:none}
.step.st-prov{border-style:dashed;border-color:var(--warn)}
.step.st-blocked{border-left:4px solid #5a5a68}
.step.has-err{border-color:var(--err);box-shadow:0 0 0 1px color-mix(in srgb,var(--err) 40%,transparent)}
.subs{padding-left:var(--s3);border-left:2px solid var(--line)}
.subs summary{cursor:pointer;color:var(--muted);margin-bottom:.4rem;font-size:.9rem;display:flex;align-items:center;gap:.4rem;list-style:none}
.subs summary::-webkit-details-marker{display:none}
.subs summary .i{transition:transform var(--t)}
.subs[open] summary .i.chev{transform:rotate(90deg)}
.sub{margin-bottom:.3rem;flex-wrap:nowrap}
.sub input.grow{padding:.25rem .5rem;min-height:1.9rem}
.sub.sdone input.grow{text-decoration:line-through;opacity:.6}
.sub.snext input.grow{border-color:var(--acc)}
.sub button{min-height:1.9rem;padding:.25rem;background:transparent;border-color:transparent;color:var(--muted)}
.next-card{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.next-card .title{font-weight:650;flex:1;min-width:0}
.quick{display:flex;gap:.5rem;align-items:center;padding:.45rem .6rem;border-radius:var(--rad-s);background:var(--bg2);border:1px solid var(--line);cursor:pointer;color:var(--text)}
.quick:hover{border-color:var(--acc)}
.progress-h{display:flex;gap:var(--s3);align-items:center}
.progress-h>div{min-width:0}
.btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,7.4rem),1fr));gap:.35rem}
.btns button{justify-content:flex-start;font-size:.88rem}

/* ===== GRANJA ===== */
.stations{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));align-items:start}
.station{display:flex;flex-direction:column;gap:var(--s3);border-top:3px solid var(--kc)}
.st-h{display:flex;gap:var(--s2);align-items:center}
.st-h .col{gap:0;flex:1;min-width:0}
.st-h small{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.st-h input{background:transparent;border-color:transparent;font-weight:650;padding-left:.2rem;width:100%}
.st-h input:hover{border-color:var(--line)}
.st-timer{display:flex;flex-direction:column;gap:.35rem;background:var(--bg2);border:1px solid var(--line);border-radius:var(--rad-s);padding:.55rem .7rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:.45rem}
.timer .i{color:var(--muted)}
.station.ready{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);animation:pulse 1.8s ease infinite}
.station.ready .timer{color:var(--ok)}.station.ready .timer .i{color:var(--ok)}
.upgs{display:flex;flex-wrap:wrap;gap:.4rem}
.upg{display:inline-flex;align-items:center;gap:.45rem;padding:.25rem .55rem .25rem .3rem;border:1px solid var(--line);border-radius:var(--rad-s);background:var(--bg2);cursor:pointer;font-size:.85rem;color:var(--muted);transition:border-color var(--t),background var(--t)}
.upg:hover{border-color:var(--line2)}
.upg:has(input:checked){border-color:color-mix(in srgb,var(--ok) 60%,transparent);background:var(--ok-soft);color:var(--text)}
.upg b{color:var(--ok);font-weight:650}
.station .body{gap:var(--s2) var(--s3)}
.station .body label{display:inline-flex;align-items:center;gap:.4rem;font-size:.88rem}
.station details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.farm-bar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.farm-bar .tools{flex-wrap:wrap}
.cfg>summary{list-style:none;cursor:pointer}
.cfg>summary::-webkit-details-marker{display:none}
.cfg>summary .chev{transition:transform var(--t)}
.cfg[open]>summary .chev{transform:rotate(90deg)}

/* ===== CALCULADORAS, DATOS, COPIAS ===== */
.cards{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));align-items:start}
.cards>.card{margin:0}
.cards>.span{grid-column:1/-1}
.search{display:inline-flex;align-items:center;gap:.4rem;background:var(--card2);border:1px solid var(--line);border-radius:var(--rad-s);padding-left:.6rem;color:var(--muted)}
.search input{border:0;background:transparent;min-width:0;flex:1}
.search input:focus{box-shadow:none}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 12rem);border-radius:var(--rad-s)}

/* ===== selector visual de elementos (diálogo) ===== */
dialog{background:var(--card);color:var(--text);border:1px solid var(--line2);border-radius:var(--rad);padding:0;width:min(52rem,calc(100vw - 1.5rem));max-height:min(88vh,48rem);box-shadow:0 30px 80px #000c}
dialog[open]{overflow:auto;overscroll-behavior:contain;animation:tin .2s ease}
.pk-h{position:sticky;top:0;background:var(--card);z-index:1}
dialog::backdrop{background:#000a;backdrop-filter:blur(2px)}
.pk-h{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4);border-bottom:1px solid var(--line)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,14.5rem),1fr));gap:.4rem;padding:var(--s3) var(--s4) var(--s4)}
.pick-grid button{justify-content:flex-start;text-align:left;gap:.6rem;padding:.45rem .55rem;white-space:normal;font-weight:500;min-height:3.4rem}
.pick-grid button span{display:flex;flex-direction:column;min-width:0}
.pick-grid button small{font-size:.75rem}

/* ===== puntos de corte ===== */
/* ventana pequeña: menú arriba en horizontal */
@media (max-width:1023.98px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:.4rem .6rem;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:.5rem}
  .brand{border:0;padding:0}
  .tabs{flex-direction:row}
  .tabs button{padding:.45rem .6rem}
  .tabs button[aria-selected=true]::before{left:.6rem;right:.6rem;top:auto;bottom:-.4rem;width:auto;height:3px}
  .nav-foot{display:none}
  .top{position:static;padding:.5rem var(--s4)}
  .wrap{padding:var(--s3) var(--s4) var(--s5)}
}
@media (max-width:760px){.brand-t{display:none}.tabs button span{display:none}.tabs button{padding:.5rem}.top-t small{display:none}.top .lbl{display:none}}
@media (max-width:520px){
  .wrap{padding:var(--s2) var(--s2) var(--s5)}
  .card,.step{padding:var(--s3)}
  .top{padding:.4rem var(--s2);flex-wrap:wrap}
  input[type=number]{width:6rem}
  .step-h .badge{display:none}
}
/* escritorio: barra lateral (estrecha) */
@media (min-width:1024px){
  :root{--nav-w:4.6rem}
  .brand-t,.tabs button span,.nav-foot .lbl,.nav-foot small{display:none}
  .tabs button{justify-content:center;padding:.65rem}
  .tabs .cnt{position:absolute;top:.15rem;right:.15rem}
  #navToggle{display:none}
  .split{grid-template-columns:minmax(0,1fr) var(--aside-w)}
  .split>.panel{grid-column:2;grid-row:1;position:sticky;top:calc(var(--top-h) + var(--s3));max-height:calc(100vh - var(--top-h) - var(--s5));overflow:auto;padding-right:2px;scrollbar-width:thin}
  .split>.content{grid-column:1;grid-row:1}
}
/* escritorio ancho: barra lateral con texto (plegable) */
@media (min-width:1360px){
  .app:not(.nav-mini){--nav-w:14rem}
  .app:not(.nav-mini) .brand-t,.app:not(.nav-mini) .tabs button span,.app:not(.nav-mini) .nav-foot .lbl,.app:not(.nav-mini) .nav-foot small{display:revert}
  .app:not(.nav-mini) .tabs button{justify-content:flex-start}
  .app:not(.nav-mini) .tabs .cnt{position:static}
  #navToggle{display:inline-flex}
  .app.nav-mini #navToggle{justify-content:center}
}
@media (min-width:2200px){:root{--aside-w:30rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.tile,.badge,.chip{border:1px solid CanvasText}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="nav" aria-label="Secciones">
    <div class="brand"><span class="logo"><svg class="i" aria-hidden="true"><use href="#i-route"/></svg></span><span class="brand-t"><b>Rob Run</b><small>Planner</small></span></div>
    <nav class="tabs" role="tablist" aria-orientation="vertical">
      <button role="tab" data-tab="ruta" title="Ruta"><svg class="i" aria-hidden="true"><use href="#i-route"/></svg><span>Ruta</span></button>
      <button role="tab" data-tab="granja" title="Granja"><svg class="i" aria-hidden="true"><use href="#i-planter"/></svg><span>Granja</span><em class="cnt" id="navReady" hidden></em></button>
      <button role="tab" data-tab="calc" title="Calculadoras"><svg class="i" aria-hidden="true"><use href="#i-calc"/></svg><span>Calculadoras</span></button>
      <button role="tab" data-tab="datos" title="Datos del juego"><svg class="i" aria-hidden="true"><use href="#i-book"/></svg><span>Datos del juego</span></button>
      <button role="tab" data-tab="copias" title="Copias"><svg class="i" aria-hidden="true"><use href="#i-db"/></svg><span>Copias</span></button>
    </nav>
    <div class="nav-foot">
      <button id="navToggle" class="ghost" title="Plegar o desplegar el menú"><svg class="i" aria-hidden="true"><use href="#i-panel"/></svg><span class="lbl">Plegar menú</span></button>
      <small id="ver"></small>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="top-t"><svg class="i" aria-hidden="true" id="pageIcon"><use href="#i-route"/></svg><h1 id="pageTitle">Ruta</h1><small id="pageSub"></small></div>
      <div class="top-kpi" id="topKpi"></div>
      <span class="tools">
        <button id="undo" class="ghost" title="Deshacer (Ctrl+Z)" disabled><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg><span class="lbl">Deshacer</span></button>
        <button id="redo" class="ghost" title="Rehacer (Ctrl+Y)" disabled><svg class="i" aria-hidden="true"><use href="#i-redo"/></svg><span class="lbl">Rehacer</span></button>
      </span>

    <main class="wrap">
      <div id="notices" aria-live="polite"></div>

      <section id="tab-ruta" role="tabpanel" class="split">
        <aside class="panel">
          <div class="card">
            <div class="card-h"><svg class="i" aria-hidden="true"><use href="#i-route"/></svg><h3>Ruta activa</h3></div>
            <select id="routes" aria-label="Ruta" style="width:100%"></select>
            <div class="btns mt">
              <button id="newRoute"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Nueva ruta</button>
              <button id="dupRoute" title="Copia exacta de la ruta, con su progreso"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg>Duplicar</button>
              <button id="newWipe" title="Copia la ruta con el progreso a cero"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>Nuevo wipe</button>
              <button id="exportRoute"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg>Exportar ruta</button>
              <button id="importBtn"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg>Importar</button>
              <button id="delRoute" class="danger"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Borrar</button>
            </div>
            <input id="importFile" type="file" accept=".json,application/json" hidden>
            <label class="fld mt" for="name">Nombre<input id="name" maxlength="120"></label>
            <label class="fld mt" for="goal">Meta final<input id="goal" maxlength="300" placeholder="Ej: título tier 3 + talleres al máximo"></label>
            <div class="fld mt">
              <label for="haveIn" title="Cosas que ya tienes de antes: cuentan como requisito cumplido">Ya tengo</label>
              <span id="haveChips" class="chips"></span>
              <div class="row" style="flex-wrap:nowrap">
                <input id="haveIn" list="catItems" placeholder="Añadir (ej. Land Plot Title Nv1)" class="grow">

          </div>

            <div class="kpis mt" id="routeStats"></div>
          </div>
          <div id="nextCard"></div>
          <div id="issues"></div>
        </aside>
        <div class="content" id="phases"></div>
      </section>

      <section id="tab-granja" role="tabpanel" class="split" hidden>

          <details class="card cfg" id="farmCfg" open>
            <summary class="card-h" style="margin:0"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg><h3>Ajustes de la granja</h3><svg class="i chev" aria-hidden="true"><use href="#i-chevron"/></svg></summary>

              <label class="fld" for="farmRoute">Granja de la ruta<select id="farmRoute"></select></label>

<script>
'use strict';
const KEY = 'robrun-rutas-v1', BKEY = 'robrun-backups', UIKEY = 'robrun-ui';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const { esc, clone } = RR;
const CAT = window.RR_CATALOG;
const IC = window.RR_ICONS; // iconos.js (si faltara, la app funciona igual sin iconos)
const fmt = RR.fmtN;
const money = n => '$' + fmt(n);
const hrs = h => h == null ? '—' : h < 1 ? Math.round(h * 60) + ' min' : h < 48 ? h.toFixed(1) + ' h' : (h / 24).toFixed(1) + ' días';
const STATUS = { done: 'Completada', prov: 'Provisional', progress: 'En progreso', pending: 'Pendiente', blocked: 'Bloqueada' };
const CONF = { confirmado: 'confirmado', 'una-fuente': 'una fuente', discrepancia: 'discrepancia', jugador: 'comprobado', estimado: 'estimado', pendiente: 'pendiente' };
const confBadge = c => c ? `<span class="badge c-${esc(c)}" title="Confianza del dato">${esc(CONF[c] || c)}</span>` : '';
const itemName = id => CAT.items[id]?.name || id;
const host = window.chrome?.webview;
const TABS = { ruta: ['Ruta', 'route', 'Pasos por fase, dependencias y validación'], granja: ['Granja', 'planter', 'Estaciones, mejoras y temporizadores'],
  calc: ['Calculadoras', 'calc', 'Rentabilidad, mejoras y simulador'], datos: ['Datos del juego', 'book', 'Catálogo con fuentes y nivel de confianza'], copias: ['Copias', 'db', 'Copias de seguridad y actualizaciones'] };

// ---------- iconos ----------
if (IC) document.body.insertAdjacentHTML('afterbegin', IC.sprite());
const ico = (n, cls = '') => IC?.paths[n] ? `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>` : '';
const tile = (n, cls = '', title = '') => `<span class="tile ${cls}"${title ? ` title="${esc(title)}"` : ''}>${ico(n)}</span>`;
const itemTip = it => [it.name, it.research ? 'investigación ' + money(it.research) : '', it.buy ? 'compra ' + money(it.buy) : '', 'tier ' + (it.tier || 1), it.conf ? 'dato ' + (CONF[it.conf] || it.conf) : ''].filter(Boolean).join(' · ');
function itemIcon(id, size = '') {
  const it = CAT.items[id]; if (!it) return tile('task', `empty ${size}`);
  const c = IC?.cats[it.cat] || {};
  return tile(IC?.items[id] || c.icon || 'task', `${c.cls || 'k-other'} ${IC?.rarity(id) || ''} ${size}`, itemTip(it));
}
const LVL = { error: 'error', warn: 'warn', info: 'info' };

// ---------- persistencia ----------
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
};
function backups() { try { const b = JSON.parse(storage.get(BKEY)); return Array.isArray(b) ? b : []; } catch { return []; } }
function pushBackup(reason, data) {
  const list = backups(); list.unshift({ at: Date.now(), reason, data });
  // máximo 6 copias; si no cabe en el almacenamiento se quitan las más viejas
  for (let n = Math.min(list.length, 6); n > 0; n--) if (storage.set(BKEY, JSON.stringify(list.slice(0, n)))) return true;
  return false;
}
const notices = [];
function notice(msg, level = 'info', actions = []) { notices.push({ msg, level, actions }); renderNotices(); }
function load() {
  const raw = storage.get(KEY);
  let data = null;
  if (raw) {
    try { data = JSON.parse(raw); }
    catch { pushBackup('Datos dañados (no se podían leer)', raw);
      notice('Tus datos guardados estaban dañados y no se podían leer. Se guardó una copia en «Copias» y la app ha empezado de cero.', 'error', [{ label: 'Ver copias', fn: () => showTab('copias') }]); }
  }
  const res = RR.migrate(data, window.RUTAS || []);
  if (data && res.from < RR.SCHEMA) pushBackup(`Antes de actualizar al formato ${RR.SCHEMA}`, raw);
  for (const n of res.notes) if (data) notice(n, 'info');
  const bad = RR.checkInvariants(res.state);
  if (bad.length) notice('Se corrigieron incoherencias al cargar: ' + bad.join(', '), 'warn');
  // copia diaria automática
  const last = backups().find(b => b.reason === 'Copia automática diaria');
  if (raw && data && (!last || Date.now() - last.at > 864e5)) pushBackup('Copia automática diaria', raw);
  return res.state;
}
let S = load();
let saveFailed = false;
function save() {
  const ok = storage.set(KEY, JSON.stringify(S));
  if (!ok && !saveFailed) notice('No se pudo guardar (almacenamiento lleno o bloqueado). Exporta una copia en «Copias» para no perder cambios.', 'error');
  saveFailed = !ok;
}
for (const n of RR.syncIncluded(S, window.RUTAS || [])) {
  if (n.kind === 'update') notice(`Hay una versión nueva de la ruta incluida «${n.name}» (v${n.version}). Tu ruta actual y su progreso no se tocan.`, 'info',
    [{ label: 'Añadir la versión nueva', fn: () => commit(st => RR.addIncludedVersion(st, (window.RUTAS || []).find(b => b.id === n.id)), { allowErrors: true, ok: 'Versión nueva añadida como ruta aparte.' }) }]);
  else if (n.kind === 'added' && storage.get(KEY)) notice(`Ruta incluida añadida: «${n.name}».`, 'info');
}
save();
window.addEventListener('storage', e => { if (e.key === KEY) notice('Los datos se cambiaron en otra ventana.', 'warn', [{ label: 'Recargar', fn: () => location.reload() }]); });
// preferencias de esta pantalla (no son datos del usuario: solo el menú plegado)
const ui = (() => { try { return JSON.parse(storage.get(UIKEY)) || {}; } catch { return {}; } })();
const saveUI = () => storage.set(UIKEY, JSON.stringify(ui));
$('#app').classList.toggle('nav-mini', !!ui.navMini);
$('#navToggle').onclick = () => { ui.navMini = !ui.navMini; saveUI(); $('#app').classList.toggle('nav-mini', ui.navMini); };
if (innerWidth < 700) $('#farmCfg').open = false; // en ventanas pequeñas los ajustes empiezan plegados

// ---------- cambios atómicos + deshacer ----------
// Cada cambio se aplica sobre una copia, se normaliza y se valida. Si mete errores nuevos en una ruta activa (no borrador)
// se rechaza y el estado no cambia; se ofrece guardarlo como borrador aparte.
const undoStack = [], redoStack = [];
const route = (st = S) => st.routes.find(r => r.id === st.cur) || st.routes[0];
const keyOf = i => i.code + '|' + i.stepId;
function commit(fn, opt = {}) {
  const before = S, next = clone(S);
  try { fn(next); } catch (e) { if (e instanceof RR.UserError) { toast(e.message, 'error'); return false; } throw e; }
  const norm = RR.normState(next);
  if (!opt.allowErrors) {
    const r0 = before.routes.find(r => r.id === norm.cur), r1 = route(norm);
    if (r1 && !r1.draft) {
      const old = new Set(r0 && r0.id === r1.id ? RR.errorsOf(RR.validateRoute(r0, before.farm)).map(keyOf) : []);
      const added = RR.errorsOf(RR.validateRoute(r1, norm.farm)).filter(i => !old.has(keyOf(i)));
      if (added.length) {
        toast(`No se aplicó el cambio: ${added[0].msg}`, 'error', opt.noDraft ? [] : [{ label: 'Guardarlo como borrador aparte', fn: () => {
          commit(st => { const id = st.cur; RR.ops.duplicateRoute(st, id, ' (borrador)'); route(st).draft = true; fn(st); }, { allowErrors: true, ok: 'Cambio guardado en un borrador. Tu ruta activa sigue igual.' }); } }]);
        render(); return false;
      }
    }
  }
  { // los límites del juego en la granja se comprueban siempre (también en borradores)
    const oldF = new Set(RR.errorsOf(RR.validateFarm(before.farm)).map(i => i.code));

  return true;
}
function undo() { if (!undoStack.length) return; redoStack.push(S); S = undoStack.pop(); save(); render(); }
function redo() { if (!redoStack.length) return; undoStack.push(S); S = redoStack.pop(); save(); render(); }

function alertReady(t) {

  try { for (let i = 0; i < 3; i++) { const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
    g.gain.value = 0.15; o.start(audio.currentTime + i * 0.35); o.stop(audio.currentTime + i * 0.35 + 0.2); } } catch {}

}

  for (const t of [S.farm, ...Object.values(S.farms)].flatMap(f => f.tables)) { // todas las rutas: la producción sigue aunque cambies de ruta
    const el = document.querySelector(`[data-timer="${CSS.escape(t.id)}"]`), card = el?.closest('.step'), bar = document.querySelector(`[data-tbar="${CSS.escape(t.id)}"]`);
    if (!t.start) { if (el) el.innerHTML = TIMER_ICO + 'Parado'; if (bar) bar.style.width = '0'; card?.classList.remove('ready'); continue; }
    const left = t.end - now;
    if (bar) bar.style.width = (t.end > t.start ? Math.min(100, Math.max(0, (now - t.start) / (t.end - t.start) * 100)) : 100) + '%';
    if (left <= 0) {

}

    ${cmp.map(c => `<tr><td class="name">${tile(IC?.kinds[c.kind] || 'task', 'sm k-' + c.kind)}<span>${esc(c.label)}</span></td><td class="n">${c.noData ? 'sin datos' : money(c.perHour)}<div class="mini"><i style="width:${c.noData ? 0 : c.perHour / maxCmp * 100}%"></i></div></td><td class="n">${money(c.investment)}</td><td class="n">${c.noData ? '—' : hrs(c.payback)}</td></tr>`).join('')}</table></div>
    <small>Mesa con 6 verdes; banco sin mejoras; el laboratorio necesita que apuntes cristales por lote (no hay datos públicos).</small></div>
  <div class="card"><div class="card-h">${ico('sliders')}<h3>Simulador</h3><small>no se guarda</small></div>
    <div class="row"><label class="inl">Estación <select id="simKind">${Object.entries(RR.KINDS).map(([k, K]) => `<option value="${k}" ${sim.kind === k ? 'selected' : ''}>${K.label}</option>`).join('')}</select></label></div>
    <div class="step station k-${sim.kind}" data-sim style="margin-top:.75rem">
      <div class="upgs">${RR.KINDS[sim.kind].upg.map(k => `<label class="upg">${itemIcon(k, 'sm')}<input type="checkbox" data-t="${k}" ${sim.upg[k] ? 'checked' : ''}> ${esc(itemName(k))}</label>`).join('')}</div>
      <div class="row body">${stationBody(sim)}</div></div>
    <div class="kpis mt">${kpi('timer', 'Ciclo', Math.round(simC.cycle) + ' min')}${kpi('trend', 'Por hora', simC.noData ? '—' : money(simC.perHour))}
      ${kpi('coin', 'Compra', money(simInv))}${kpi('hourglass', 'Se paga en', simC.perHour > 0 ? hrs(simInv / simC.perHour) : '—')}</div></div>`;
  const out = () => { const v = +$('#goalAmt').value || 0; $('#goalOut').innerHTML = tot.perHour > 0 ? kpi('trend', 'Teórico', hrs(v / tot.perHour)) + (realH > 0 ? kpi('chart', 'Real', hrs(v / realH)) : '') : '<small>Sin producción en la granja.</small>'; };
  $('#goalAmt').oninput = out; out();
}
$('#tab-calc').addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'simKind') { sim = RR.normStation({ kind: el.value, g: el.value === 'plant' ? 6 : 0 }); return renderCalc(); }
  if (!el.closest('[data-sim]') || !el.dataset.t) return;
  const st = { farm: S.farm, routes: [], cur: '' }; st.farm = { ...S.farm, tables: [sim] };
  const f = el.dataset.t, v = el.type === 'checkbox' ? el.checked : el.tagName === 'SELECT' && f !== 'box' && f !== 'quality' ? +el.value : el.type === 'number' ? +el.value : el.value;
  RR.ops.setStation(st, sim.id, f, v); sim = st.farm.tables[0]; renderCalc();
});

// ---------- DATOS DEL JUEGO ----------
let datosFilter = '', datosCat = '';
function srcLinks(list) { return (list || []).map(k => { const s = CAT.SOURCES[k]; return s?.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" title="${esc(s.date)}">${esc(new URL(s.url).hostname.replace('www.', ''))}</a>` : esc(s?.note || k); }).join(', '); }
function renderDatos() {
  const q = datosFilter.toLowerCase(), items = Object.values(CAT.items).filter(it => (!datosCat || it.cat === datosCat) && (!q || (it.name + it.cat + (it.notes || '')).toLowerCase().includes(q)));
  const cats = [...new Set(Object.values(CAT.items).map(it => it.cat))];
  $('#datosBody').innerHTML = `<div class="card"><div class="row"><span class="grow">${ico('book')} Catálogo <b>${esc(CAT.version)}</b> · juego ${esc(CAT.game)} · verificado ${esc(CAT.verified)}</span>
    <label class="search" style="flex:1 1 14rem;max-width:24rem">${ico('search')}<input id="datosQ" placeholder="Filtrar…" value="${esc(datosFilter)}" aria-label="Filtrar catálogo"></label></div>
    <div class="chips mt">${[['', 'Todo'], ...cats.map(c => [c, c])].map(([k, n]) => `<button class="chip filter" data-dcat="${esc(k)}" aria-pressed="${datosCat === k}">${k ? ico(IC?.cats[k]?.icon || 'task') : ''}${esc(n)}</button>`).join('')}</div>
    <p><small>Kefir no publica precios: son datos de wikis de fans. «confirmado» = 2+ fuentes coinciden; «una fuente»; «discrepancia» = no coinciden (se muestra la alternativa); «comprobado» = visto por ti en el juego. Los iconos son propios de esta app, no del juego.</small></p></div>
  <div class="card mt"><div class="tbl-wrap"><table><tr><th>Elemento</th><th>Tipo</th><th class="n">Investigación</th><th class="n">Compra</th><th>Tier</th><th>Requiere</th><th>Dato</th><th>Fuentes / notas</th></tr>
    ${items.map(it => `<tr><td class="name">${itemIcon(it.id, 'sm')}<span>${esc(it.name)}</span></td><td>${esc(it.cat)}</td><td class="n">${it.research ? money(it.research) : '—'}</td><td class="n">${it.buy ? money(it.buy) : '—'}</td><td>${it.tier || 1}</td>
      <td>${(it.requires || []).map(itemName).map(esc).join(', ')}${it.tier > 1 ? `${it.requires?.length ? ', ' : ''}parcela nivel ${it.tier}` : ''}</td><td>${confBadge(it.conf)}</td>
      <td><small>${esc(it.notes || '')}${it.alt ? ' · Alternativa: ' + esc(it.alt) : ''}</small><br>${srcLinks(it.src)}</td></tr>`).join('')}</table>
    ${items.length ? '' : '<div class="empty">Nada coincide con el filtro.</div>'}</div></div>
  <div class="card mt"><div class="card-h">${ico('sliders')}<h3>Valores de producción por defecto</h3></div><div class="scroll"><table><tr><th>Dato</th><th class="n">Valor</th><th>Confianza</th><th>Fuentes / notas</th></tr>
    ${Object.entries(CAT.defaults).map(([k, d]) => `<tr><td>${esc(k)}</td><td class="n">${fmt(d.value)}</td><td>${confBadge(d.conf)}</td><td><small>${esc(d.notes || '')}${d.alt ? ' · Alternativa: ' + esc(d.alt) : ''}</small><br>${srcLinks(d.src)}</td></tr>`).join('')}
    ${Object.entries(CAT.notoriety).map(([k, d]) => `<tr><td>${ico('star')} Notoriedad · ${esc(k)}</td><td class="n">${d.values.map(v => '+' + Math.round(v * 100) + '%').join(' / ')}</td><td>${confBadge(d.conf)}</td><td><small>${esc(d.notes || '')}</small><br>${srcLinks(d.src)}</td></tr>`).join('')}
    ${Object.entries(CAT.limits).map(([k, d]) => `<tr><td>${ico('st_blocked')} Límite · ${esc(k)}</td><td class="n">${fmt(d.value)}</td><td>${confBadge(d.conf)}</td><td><small>${esc(d.notes || '')}</small><br>${srcLinks(d.src)}</td></tr>`).join('')}
  </table></div></div>`;
  const inp = $('#datosQ'); inp.oninput = () => { datosFilter = inp.value; renderDatos(); const i = $('#datosQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
}
$('#tab-datos').addEventListener('click', e => { const c = e.target.closest('[data-dcat]'); if (c) { datosCat = c.dataset.dcat; renderDatos(); } });

// ---------- COPIAS ----------
function renderCopias() {
  const list = backups();
  $('#copiasBody').innerHTML = `<div class="card"><div class="card-h">${ico('download')}<h3>Copia completa</h3></div>
    <p><small>Guarda todas tus rutas, la granja y los temporizadores en un archivo. Para pasar tus datos a otro equipo o navegador, o antes de tocar algo importante.</small></p>
    <div class="row"><button id="exportAll" class="primary">${ico('download')}Descargar copia completa</button><button id="restoreFile">${ico('upload')}Restaurar desde archivo…</button><input id="restoreIn" type="file" accept=".json,application/json" hidden></div></div>
  <div class="card"><div class="card-h">${ico('refresh')}<h3>Actualizaciones</h3><span class="badge">v${esc(RR.APP_VERSION)}</span></div><p><small>La app mira sola cada 6 h si hay una versión nueva en GitHub. Actualizar no borra tus rutas ni tu granja.</small></p><button id="checkUpd">${ico('refresh')}Buscar actualizaciones</button></div>
  <div class="card"><div class="card-h">${ico('warn')}<h3>Empezar de cero</h3></div><p><small>Borra rutas, granja y temporizadores de este equipo (se guarda una copia antes).</small></p><button id="resetAll" class="danger">${ico('trash')}Borrar todos mis datos…</button></div>
  <div class="card span"><div class="card-h">${ico('db')}<h3>Copias automáticas en este equipo</h3><span class="badge">${list.length}/6</span></div>
    ${list.length ? `<div class="scroll"><table><tr><th>Fecha</th><th>Motivo</th><th></th></tr>${list.map((b, i) => `<tr><td>${new Date(b.at).toLocaleString('es')}</td><td>${esc(b.reason)}</td>
      <td class="n"><button data-bk="${i}" data-op="restore">${ico('undo')}Restaurar</button> <button data-bk="${i}" data-op="dl" class="ghost">${ico('download')}Descargar</button></td></tr>`).join('')}</table></div>`
    : '<div class="empty">Aún no hay copias. Se crean solas una vez al día, antes de actualizar el formato y antes de restaurar.</div>'}</div>`;
}
$('#tab-copias').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'exportAll') return download(`robrun-copia-${new Date().toISOString().slice(0, 10)}.json`, { format: 'robrun-copia', app: RR.APP_VERSION, ...S });
  if (b.id === 'restoreFile') return $('#restoreIn').click();
  if (b.id === 'checkUpd') return checkUpdate(true);
  if (b.id === 'resetAll') { if (confirm('¿Borrar todas tus rutas, la granja y los temporizadores? Se guarda una copia antes en esta misma pestaña.')) {
    pushBackup('Antes de empezar de cero', JSON.stringify(S)); undoStack.push(S); S = RR.normState(null); save(); render(); toast('Datos borrados. Hay una copia en «Copias».', 'ok', [{ label: 'Deshacer', fn: undo }]); } return; }
  const bk = backups()[+b.dataset.bk]; if (!bk) return;
  if (b.dataset.op === 'dl') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bk.data], { type: 'application/json' })); a.download = `robrun-copia-${bk.at}.json`; a.click(); return; }
  let parsed; try { parsed = JSON.parse(bk.data); } catch { return toast('Esta copia está dañada y no se puede restaurar. Descárgala para revisarla.', 'error'); }
  if (confirm(`¿Restaurar la copia del ${new Date(bk.at).toLocaleString('es')}? Lo actual se guarda antes como otra copia.`)) restoreFull(parsed);
});
$('#tab-copias').addEventListener('change', async e => {
  if (e.target.id !== 'restoreIn') return; const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch { return toast('El archivo no es un JSON válido.', 'error'); }
  if (!data || !Array.isArray(data.routes)) return toast('Ese archivo no es una copia completa. Para añadir rutas usa «Importar» en la pestaña Ruta.', 'error');
  if (confirm('¿Restaurar esta copia? Sustituye tus datos actuales (se guarda una copia antes).')) restoreFull(data);
});

// ---------- arranque ----------
function render() {
  $('#undo').disabled = !undoStack.length; $('#redo').disabled = !redoStack.length;
  $('#catItems').innerHTML ||= Object.values(CAT.items).map(it => `<option value="${esc(it.name)}">${esc(it.cat)}</option>`).join('');
  renderTop();
  const tab = S.tab;
  if (tab === 'ruta') renderRoute(); else if (tab === 'granja') renderFarm(); else if (tab === 'calc') renderCalc(); else if (tab === 'datos') renderDatos(); else renderCopias();
  if (tab !== 'granja') tick();
}
// ---------- actualizaciones: solo lee la última release del repo de GitHub; nunca toca tus datos ----------
const UPD_KEY = 'robrun-update-check';
async function checkUpdate(manual) {
  if (!manual && Date.now() - (+storage.get(UPD_KEY) || 0) < 6 * 3600e3) return; // como mucho cada 6 h
  storage.set(UPD_KEY, String(Date.now()));
  // 1) API de releases (lo exacto). Sin cuenta, GitHub solo deja 60 consultas por hora y por IP (compartida con
  //    otros programas y con todo tu router); si se agota, 2) la versión de package.json en raw.githubusercontent.com.
  let tag = '';
  try { const r = await fetch(`https://api.github.com/repos/${RR.REPO}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' } }); if (r.ok) tag = String((await r.json())?.tag_name || ''); } catch {}
  if (!tag) try { const r = await fetch(`https://raw.githubusercontent.com/${RR.REPO}/main/package.json`, { cache: 'no-store' }); if (r.ok) { const v = String((await r.json())?.version || ''); if (v) tag = 'v' + v; } } catch {}
  if (!tag) { if (manual) toast('No se pudo consultar GitHub. Revisa la conexión o prueba más tarde.', 'error'); return; }
  if (!RR.isNewer(tag)) { if (manual) toast(`Tienes la última versión (v${RR.APP_VERSION}).`, 'ok'); return; }
  const acts = host
    ? [{ label: 'Actualizar ahora', fn: () => { host.postMessage({ update: true }); toast('Descargando la actualización… La app se cerrará y se abrirá sola.', 'info'); } }]
    : [{ label: 'Ver descarga', fn: () => window.open(`https://github.com/${RR.REPO}/releases/latest`, '_blank', 'noopener') }];
  notice(`Hay una versión nueva: ${tag} (tienes v${RR.APP_VERSION}). Tus rutas y tu granja no se tocan al actualizar.`, 'info', acts);
}
host?.addEventListener('message', e => { if (e.data?.updateError) toast(`No se pudo actualizar: ${e.data.updateError}`, 'error'); });
setTimeout(() => checkUpdate(false), 3000);
$('#ver').textContent = `v${RR.APP_VERSION} · datos ${CAT.version}`;
renderNotices();
showTab(S.tab);
window.RRApp = { get S() { return S; }, commit, undo, redo, render, showTab, backups, pushBackup, restoreFull, load }; // para pruebas
</script>
